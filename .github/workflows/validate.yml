name: Validate template and browser pairing
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML
        run: python3 -c "import xml.etree.ElementTree as E; E.parse('opencode.xml')"
      - name: Shell regression tests
        run: sh tests/pair-browser.test.sh
      - name: Pair with pinned upstream container
        run: sh tests/pair-browser-live.sh
